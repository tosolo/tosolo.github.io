<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tosolo is an independent studio making games and useful apps.">
  <meta name="theme-color" content="#0000a8">
  <title>tosolo - indie games</title>
  <style>
    :root { color-scheme:dark; --blue:#0000a8; --text:#e7e7ef; --white:#fff; --cyan:#9fffff; }
    * { box-sizing:border-box; }
    html { min-height:100%; background:#000; }
    body { margin:0; min-height:100vh; color:var(--text); font:16px/1.35 "Courier New",monospace; background:#000; }
    a { color:inherit; }
    .site { width:100%; max-width:430px; min-height:100vh; margin:0 auto; display:flex; flex-direction:column; background:var(--blue); }
    .masthead { position:relative; height:120px; display:flex; flex-direction:column; align-items:center; justify-content:center; border-bottom:1px solid var(--white); background:var(--blue); overflow:hidden; }
    .logo { width:170px; height:62px; object-fit:contain; }
    .language-switch { position:absolute; top:10px; right:12px; color:var(--white); font-size:16px; }
    .tagline { margin:2px 8px 0; color:var(--white); font-size:12px; text-align:center; }
    .layout { display:flex; flex:1; flex-direction:column; background:var(--blue); }
    .main { min-width:0; flex:1; display:flex; flex-direction:column; }
    .panel { border-bottom:1px solid var(--white); }
    #games { flex:1; }
    .bar { min-height:30px; padding:6px 8px; color:var(--white); font-size:18px; font-weight:bold; }
    .games { display:grid; grid-template-columns:1fr; gap:0; padding:0; background:transparent; }
    .game { min-width:0; min-height:124px; padding:8px; display:flex; align-items:center; gap:14px; border:0; background:transparent; color:var(--white); text-align:left; text-decoration:none; }
    .game + .game { border-top:1px solid var(--white); }
    .game img,.coming { display:grid; width:100px; height:100px; flex:0 0 100px; object-fit:cover; background:#000; }
    .coming { place-items:center; border:1px solid var(--white); color:var(--white); background:var(--blue); font-size:16px; font-weight:400; text-align:center; }
    .game-copy { display:flex; flex-direction:column; gap:6px; }
    .game-name { display:block; padding:0; font-size:16px; font-weight:bold; }
    .game-type { font-size:16px; }
    .mail { min-height:100px; padding:12px 10px; color:var(--cyan); background:transparent; }
    .mail a { display:inline-block; margin-top:10px; padding:3px 8px; border:1px solid var(--white); color:var(--white); background:transparent; font-weight:bold; text-decoration:none; }
    .about { margin-top:0; padding:9px; background:transparent; }
    .about p { margin:0 0 7px; font-size:16px; }
    .about-links { display:flex; flex-wrap:wrap; gap:6px 12px; color:var(--white); font-size:16px; }
    footer { display:flex; justify-content:space-between; gap:8px; padding:8px; border-top:1px solid var(--white); color:#ddd; font-size:16px; }
    footer a { color:var(--white); }
    @media (min-width:431px) { .site { margin-top:0; } }
  </style>
</head>
<body>
  <main class="site">
    <header class="masthead">
      <a class="language-switch" href="https://tosolo.net/" lang="en" hreflang="en">English</a>
      <img class="logo" src="../logo_renewal.webp" alt="tosolo">
    </header>
    <div class="layout">
      <div class="main" id="home">
        <section class="panel" id="games">
          <div class="games">
            <a class="game" href="frog-domino/"><img src="../icon_frogdomino.webp" alt=""><span class="game-copy"><span class="game-name">개구리 도미노</span><span class="game-type">모바일 퍼즐 게임</span></span></a>
            <a class="game" href="https://tosolo.net/filetracker/"><img src="../icon_filetracker.webp" alt=""><span class="game-copy"><span class="game-name">파일트래커 for Gmail</span><span class="game-type">유틸리티 앱</span></span></a>
            <div class="game"><span class="coming">출시<br>예정</span><span class="game-copy"><span class="game-name">프로젝트 BM</span><span class="game-type">로그라이트</span></span></div>
          </div>
        </section>
      </div>
      <section class="about" id="about"><p>&#xd1a0;&#xc194;&#xb85c;&#xc758; &#xac1c;&#xbc1c;&#xc790; &#xb860;&#xc785;&#xb2c8;&#xb2e4;.</p><div class="about-links"><a href="https://www.threads.com/@tosolo.dev">Threads</a><a href="https://x.com/tosolo_dev">X</a><a href="https://www.reddit.com/user/tosolo_dev/">Reddit</a></div></section>
    </div>
    <footer><div><a href="../terms-kr.html">이용약관</a> · <a href="../privacy-kr.html">개인정보 처리방침</a></div><div>© 2026 tosolo</div></footer>
  </main>
</body>
</html>
